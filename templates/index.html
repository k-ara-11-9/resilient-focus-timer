<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Focus Timer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Focus timer</h1>
        <nav>
            <a href="/" class="active">Timer</a>
            <a href="/history">History</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>
    <div class="page-wrapper">
        <div class="app-container">
            <main>
            <div id="warningBanner" class="warning-banner" style="display: none;"></div>

            <div class="duration-picker">
                <label for="durationSelect">Focus duration:</label>
                <select id="durationSelect">
                    <option value="5">5 min</option>
                    <option value="10">10 min</option>
                    <option value="15">15 min</option>
                    <option value="20">20 min</option>
                    <option value="25" selected>25 min (Pomodoro)</option>
                    <option value="30">30 min</option>
                    <option value="45">45 min</option>
                    <option value="50">50 min</option>
                    <option value="60">60 min</option>
                    <option value="90">90 min</option>
                </select>
            </div>

            <div class="timer-container">
                <svg class="progress-ring" viewBox="0 0 100 100">
                    <circle class="progress-ring__track" cx="50" cy="50" r="45"></circle>
                    <circle class="progress-ring__circle" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="timer-content">
                    <span class="timer-label">focus session</span>
                    <span class="timer-time" id="timeDisplay">25:00</span>
                    <span class="timer-status" id="statusDisplay">idle</span>
                </div>
            </div>

            <div class="controls">
                <button id="actionBtn">Start Timer</button>
                <button id="intrusionBtn" disabled>
                    Intrusion <span id="intrusionCount" class="badge" style="display: none;">0</span>
                </button>
            </div>
            <div class="secondary-controls" style="margin-top: 16px; text-align: center;">
                <button id="stopEarlyBtn" style="display: none; background: none; border: none; color: #a49692; text-decoration: underline; cursor: pointer; font-size: 0.9rem;">Stop early</button>
            </div>
        </main>
        </div>
    </div>

    <audio id="notificationSound" src="/static/notification.mp3" preload="auto"></audio>
    <script src="/static/auth.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
