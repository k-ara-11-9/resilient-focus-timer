<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Resilient Focus Timer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Focus timer</h1>
        <nav>
            <a href="/login">Login</a>
            <a href="/signup" class="active">Signup</a>
        </nav>
    </header>
    <div class="page-wrapper">
        <div class="app-container" style="text-align: center;">
            <h2>Signup</h2>
            <form id="signupForm" style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
                <input type="text" id="username" placeholder="Username" required style="padding: 12px; border-radius: 8px; border: 1px solid #3d3432; background: #1a1514; color: white;">
                <input type="email" id="email" placeholder="Email" required style="padding: 12px; border-radius: 8px; border: 1px solid #3d3432; background: #1a1514; color: white;">
                <input type="password" id="password" placeholder="Password" required style="padding: 12px; border-radius: 8px; border: 1px solid #3d3432; background: #1a1514; color: white;">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required style="padding: 12px; border-radius: 8px; border: 1px solid #3d3432; background: #1a1514; color: white;">
                <button type="submit" style="padding: 12px; border-radius: 8px; background: #ff9d76; color: #1a1514; font-weight: bold; border: none; cursor: pointer;">Sign Up</button>
                <div id="errorMsg" style="color: #ff6b6b; font-size: 0.9rem; display: none;"></div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                    credentials: 'include'
                });
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.error || 'Signup failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = "can't reach server";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
